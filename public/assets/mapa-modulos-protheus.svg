<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Mapa de integração entre módulos do Protheus</title>
  <desc id="desc">Diagrama mostrando os módulos do ERP Protheus (PCP, Estoque, Compras, Faturamento, Financeiro, Contábil, Fiscal, RH, PCO, Qualidade) conectados ao núcleo do sistema por parâmetros MV_ de integração.</desc>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <g stroke="#94a3b8" stroke-width="2.5" marker-end="url(#seta)">
    <line x1="450" y1="450" x2="450" y2="150"/>
    <line x1="450" y1="450" x2="680" y2="230"/>
    <line x1="450" y1="450" x2="770" y2="450"/>
    <line x1="450" y1="450" x2="680" y2="670"/>
    <line x1="450" y1="450" x2="450" y2="750"/>
    <line x1="450" y1="450" x2="220" y2="670"/>
    <line x1="450" y1="450" x2="130" y2="450"/>
    <line x1="450" y1="450" x2="220" y2="230"/>
  </g>

  <g font-family="Verdana, Arial, sans-serif" font-size="13" fill="#475569">
    <text x="460" y="300" text-anchor="start">MV_PCOINTE</text>
    <text x="600" y="320" text-anchor="middle">MV_QIPEST</text>
    <text x="640" y="455" text-anchor="middle">MV_1DUPNAT</text>
    <text x="600" y="590" text-anchor="middle">MV_BLKTP*</text>
    <text x="460" y="610" text-anchor="start">MV_BTITFOL</text>
    <text x="300" y="590" text-anchor="middle">MV_PRELAN</text>
    <text x="260" y="455" text-anchor="middle">D3_OP</text>
    <text x="300" y="320" text-anchor="middle">MV_BLOQUEI</text>
  </g>

  <g>
    <circle cx="450" cy="450" r="95" fill="#1e293b"/>
    <text x="450" y="440" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="20" fill="#f8fafc" font-weight="bold">PROTHEUS</text>
    <text x="450" y="465" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="12" fill="#cbd5e1">núcleo / dados</text>
  </g>

  <g>
    <rect x="370" y="90" width="160" height="70" rx="16" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
    <text x="450" y="118" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="22">📈</text>
    <text x="450" y="142" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#78350f" font-weight="bold">PCO</text>
  </g>

  <g>
    <rect x="600" y="170" width="160" height="70" rx="16" fill="#bbf7d0" stroke="#15803d" stroke-width="2"/>
    <text x="680" y="198" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="22">✅</text>
    <text x="680" y="222" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#14532d" font-weight="bold">Qualidade</text>
  </g>

  <g>
    <rect x="690" y="415" width="160" height="70" rx="16" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="770" y="443" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="22">💰</text>
    <text x="770" y="467" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#1e3a8a" font-weight="bold">Financeiro</text>
  </g>

  <g>
    <rect x="600" y="635" width="160" height="70" rx="16" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/>
    <text x="680" y="663" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="22">🧮</text>
    <text x="680" y="687" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#7f1d1d" font-weight="bold">Fiscal</text>
  </g>

  <g>
    <rect x="370" y="715" width="160" height="70" rx="16" fill="#fbcfe8" stroke="#be185d" stroke-width="2"/>
    <text x="450" y="743" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="22">👥</text>
    <text x="450" y="767" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#831843" font-weight="bold">RH</text>
  </g>

  <g>
    <rect x="140" y="635" width="160" height="70" rx="16" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2"/>
    <text x="220" y="663" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="22">📊</text>
    <text x="220" y="687" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#4c1d95" font-weight="bold">Contábil</text>
  </g>

  <g>
    <rect x="50" y="415" width="160" height="70" rx="16" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/>
    <text x="130" y="443" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="22">🛒</text>
    <text x="130" y="467" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#7c2d12" font-weight="bold">Compras</text>
  </g>

  <g>
    <rect x="140" y="170" width="160" height="70" rx="16" fill="#fef08a" stroke="#a16207" stroke-width="2"/>
    <text x="220" y="198" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="22">🏭📦</text>
    <text x="220" y="222" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#713f12" font-weight="bold">PCP / Estoque</text>
  </g>

  <g>
    <rect x="30" y="30" width="180" height="60" rx="14" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
    <text x="120" y="55" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="18">🧾</text>
    <text x="120" y="75" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="13" fill="#1e293b" font-weight="bold">Vendas / Faturamento</text>
  </g>
  <line x1="120" y1="90" x2="220" y2="170" stroke="#94a3b8" stroke-width="2" marker-end="url(#seta)"/>

  <text x="450" y="855" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="12" fill="#64748b">
    Fonte dos parâmetros: TDN e Central de Atendimento TOTVS (ver página Fontes)
  </text>
</svg>
