<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Fluxo industrial do Protheus: Venda, PCP, Estoque, Compras, Financeiro e Fiscal</title>
  <desc id="desc">Diagrama do fluxo de manufatura no Protheus: pedido de venda alimenta o plano mestre do PCP, que gera ordem de produção, movimenta estoque, dispara compras via MRP, gera título a pagar no financeiro e alimenta o Bloco K do SPED Fiscal.</desc>
  <defs>
    <marker id="seta2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <g stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#seta2)">
    <path d="M170,90 L170,170"/>
    <path d="M300,205 L370,205"/>
    <path d="M530,205 L600,205"/>
    <path d="M760,205 L830,205"/>
    <path d="M600,240 L600,330"/>
  </g>
  <text x="185" y="135" font-family="Verdana, Arial, sans-serif" font-size="12" fill="#334155">carteira de pedidos</text>
  <text x="335" y="195" font-family="Verdana, Arial, sans-serif" font-size="12" fill="#334155">Ordem de Produção</text>
  <text x="545" y="195" font-family="Verdana, Arial, sans-serif" font-size="11" fill="#334155">D3_OP</text>
  <text x="770" y="195" font-family="Verdana, Arial, sans-serif" font-size="11" fill="#334155">MRP</text>
  <text x="615" y="290" font-family="Verdana, Arial, sans-serif" font-size="11" fill="#334155">MV_BLKTP*</text>

  <g>
    <rect x="60" y="20" width="220" height="70" rx="16" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
    <text x="170" y="48" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="20">🧾</text>
    <text x="170" y="72" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="13" fill="#1e293b" font-weight="bold">Pedido de Venda (SC5)</text>
  </g>

  <g>
    <rect x="60" y="170" width="240" height="70" rx="16" fill="#fef08a" stroke="#a16207" stroke-width="2"/>
    <text x="180" y="198" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="20">🏭</text>
    <text x="180" y="222" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="13" fill="#713f12" font-weight="bold">PCP: Plano Mestre + OP</text>
  </g>

  <g>
    <rect x="370" y="170" width="160" height="70" rx="16" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/>
    <text x="450" y="198" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="20">📦</text>
    <text x="450" y="222" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="13" fill="#7c2d12" font-weight="bold">Estoque (SD3)</text>
  </g>

  <g>
    <rect x="600" y="170" width="160" height="70" rx="16" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
    <text x="680" y="198" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="20">🛒</text>
    <text x="680" y="222" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="13" fill="#78350f" font-weight="bold">Compras (SC7)</text>
  </g>

  <g>
    <rect x="830" y="170" width="200" height="70" rx="16" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="930" y="198" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="20">💰</text>
    <text x="930" y="222" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="13" fill="#1e3a8a" font-weight="bold">Título a Pagar (SE2)</text>
  </g>
  <text x="930" y="252" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="11" fill="#334155">MV_1DUPNAT / MV_2DUPNAT</text>

  <g>
    <rect x="500" y="330" width="200" height="70" rx="16" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/>
    <text x="600" y="358" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="20">🧮</text>
    <text x="600" y="382" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="13" fill="#7f1d1d" font-weight="bold">SPED Fiscal · Bloco K</text>
  </g>
  <text x="600" y="420" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="11" fill="#334155">registros K200 · K230 · K235</text>

  <text x="550" y="450" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="12" fill="#64748b">
    Fonte: TDN e Central de Atendimento TOTVS (ver página Fontes)
  </text>
</svg>
